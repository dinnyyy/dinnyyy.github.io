<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Maze solver — a grid maze with a highlighted solution path">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1020"/>
      <stop offset="1" stop-color="#141433"/>
    </linearGradient>
    <linearGradient id="mpath" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#mbg)"/>
  <!-- maze grid cells -->
  <g transform="translate(160,60)">
    <g fill="#161a2e" stroke="#2a3050" stroke-width="1.5">
      <!-- 8x6 grid of cells -->
      <g>
        <rect x="0" y="0" width="60" height="60"/><rect x="60" y="0" width="60" height="60"/><rect x="120" y="0" width="60" height="60"/><rect x="180" y="0" width="60" height="60"/><rect x="240" y="0" width="60" height="60"/><rect x="300" y="0" width="60" height="60"/><rect x="360" y="0" width="60" height="60"/><rect x="420" y="0" width="60" height="60"/>
        <rect x="0" y="60" width="60" height="60"/><rect x="60" y="60" width="60" height="60"/><rect x="120" y="60" width="60" height="60"/><rect x="180" y="60" width="60" height="60"/><rect x="240" y="60" width="60" height="60"/><rect x="300" y="60" width="60" height="60"/><rect x="360" y="60" width="60" height="60"/><rect x="420" y="60" width="60" height="60"/>
        <rect x="0" y="120" width="60" height="60"/><rect x="60" y="120" width="60" height="60"/><rect x="120" y="120" width="60" height="60"/><rect x="180" y="120" width="60" height="60"/><rect x="240" y="120" width="60" height="60"/><rect x="300" y="120" width="60" height="60"/><rect x="360" y="120" width="60" height="60"/><rect x="420" y="120" width="60" height="60"/>
        <rect x="0" y="180" width="60" height="60"/><rect x="60" y="180" width="60" height="60"/><rect x="120" y="180" width="60" height="60"/><rect x="180" y="180" width="60" height="60"/><rect x="240" y="180" width="60" height="60"/><rect x="300" y="180" width="60" height="60"/><rect x="360" y="180" width="60" height="60"/><rect x="420" y="180" width="60" height="60"/>
        <rect x="0" y="240" width="60" height="60"/><rect x="60" y="240" width="60" height="60"/><rect x="120" y="240" width="60" height="60"/><rect x="180" y="240" width="60" height="60"/><rect x="240" y="240" width="60" height="60"/><rect x="300" y="240" width="60" height="60"/><rect x="360" y="240" width="60" height="60"/><rect x="420" y="240" width="60" height="60"/>
      </g>
    </g>
    <!-- visited (frontier) cells -->
    <g fill="#a78bfa" fill-opacity="0.18">
      <rect x="60" y="0" width="60" height="60"/><rect x="60" y="120" width="60" height="60"/><rect x="240" y="60" width="60" height="60"/><rect x="300" y="180" width="60" height="60"/>
    </g>
    <!-- solution path -->
    <path d="M30 30 H90 V150 H210 V90 H330 V210 H450 V270" fill="none" stroke="url(#mpath)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="30" r="11" fill="#34d399"/>
    <circle cx="450" cy="270" r="11" fill="#f472b6"/>
  </g>
  <text x="160" y="452" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#c7d0e6" letter-spacing="1">A* · BFS · DFS · Greedy · Wall-follower</text>
  <text x="160" y="474" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#6ea8fe" letter-spacing="2" opacity="0.85">MAZE SOLVER &amp; ALGORITHM VISUALISER</text>
</svg>
