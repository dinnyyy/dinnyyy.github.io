<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Volatility forecasting — a returns chart showing volatility clustering">
  <defs>
    <linearGradient id="vlbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c111f"/>
      <stop offset="1" stop-color="#0f1a2a"/>
    </linearGradient>
    <linearGradient id="vlfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ea8fe" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6ea8fe" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#vlbg)"/>
  <g stroke="#6ea8fe" stroke-opacity="0.07">
    <path d="M80 100H740M80 180H740M80 260H740M80 340H740"/>
  </g>
  <!-- axes -->
  <line x1="80" y1="80" x2="80" y2="360" stroke="#33405e" stroke-width="1.5"/>
  <line x1="80" y1="360" x2="740" y2="360" stroke="#33405e" stroke-width="1.5"/>
  <!-- volatility area (squared returns spikes) -->
  <path d="M80 360 L120 340 L150 350 L180 300 L210 348 L240 330 L270 352
           L300 210 L320 120 L340 250 L360 330 L400 340 L440 300 L470 345
           L520 250 L560 320 L600 300 L640 335 L680 315 L720 345 L740 350 L740 360 Z"
        fill="url(#vlfill)"/>
  <path d="M80 360 L120 340 L150 350 L180 300 L210 348 L240 330 L270 352
           L300 210 L320 120 L340 250 L360 330 L400 340 L440 300 L470 345
           L520 250 L560 320 L600 300 L640 335 L680 315 L720 345 L740 350"
        fill="none" stroke="#6ea8fe" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- forecast dashed continuation -->
  <path d="M740 350 C760 330 770 320 780 300" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-dasharray="5 5"/>
  <!-- annotation of the 2020 spike -->
  <circle cx="320" cy="120" r="5" fill="#f472b6"/>
  <text x="336" y="118" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#f472b6">2020 shock</text>
  <text x="80" y="72" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#9aa2b1">σ²  GARCH(1,1) · S&amp;P 500</text>
  <text x="80" y="452" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#c7d0e6" letter-spacing="1">Ljung–Box · ARCH-LM · MLE fit</text>
  <text x="80" y="474" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#6ea8fe" letter-spacing="2" opacity="0.85">VOLATILITY FORECASTING</text>
</svg>
