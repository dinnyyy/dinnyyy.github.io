<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Trading bot — candlestick chart with buy and sell signals">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0e1b1a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#tbg)"/>
  <g stroke="#34d399" stroke-opacity="0.06">
    <path d="M80 120H740M80 200H740M80 280H740M80 360H740"/>
  </g>
  <line x1="80" y1="90" x2="80" y2="360" stroke="#33405e" stroke-width="1.5"/>
  <line x1="80" y1="360" x2="740" y2="360" stroke="#33405e" stroke-width="1.5"/>
  <!-- candlesticks: green up, red down -->
  <g stroke-width="2">
    <!-- x, wick top, wick bottom, body top, body bottom -->
    <g stroke="#34d399" fill="#34d399" fill-opacity="0.85">
      <line x1="120" y1="250" x2="120" y2="310"/><rect x="112" y="265" width="16" height="35"/>
      <line x1="170" y1="230" x2="170" y2="300"/><rect x="162" y="245" width="16" height="45"/>
      <line x1="270" y1="200" x2="270" y2="270"/><rect x="262" y="210" width="16" height="45"/>
      <line x1="420" y1="150" x2="420" y2="230"/><rect x="412" y="160" width="16" height="55"/>
      <line x1="470" y1="130" x2="470" y2="200"/><rect x="462" y="140" width="16" height="45"/>
      <line x1="620" y1="150" x2="620" y2="220"/><rect x="612" y="160" width="16" height="50"/>
    </g>
    <g stroke="#f87171" fill="#f87171" fill-opacity="0.85">
      <line x1="220" y1="215" x2="220" y2="285"/><rect x="212" y="230" width="16" height="40"/>
      <line x1="320" y1="185" x2="320" y2="255"/><rect x="312" y="200" width="16" height="40"/>
      <line x1="370" y1="165" x2="370" y2="240"/><rect x="362" y="180" width="16" height="45"/>
      <line x1="520" y1="145" x2="520" y2="225"/><rect x="512" y="160" width="16" height="50"/>
      <line x1="570" y1="160" x2="570" y2="235"/><rect x="562" y="175" width="16" height="50"/>
      <line x1="670" y1="185" x2="670" y2="255"/><rect x="662" y="200" width="16" height="45"/>
    </g>
  </g>
  <!-- HMM regime line -->
  <path d="M112 300 C200 290 240 250 320 235 S460 175 520 195 640 220 728 210"
        fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="6 4"/>
  <!-- buy / sell markers -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="700">
    <path d="M120 335 l8 14 l-16 0 z" fill="#34d399"/>
    <path d="M370 130 l8 -14 l-16 0 z" fill="#f87171"/>
    <path d="M470 105 l8 -14 l-16 0 z" fill="#f87171"/>
  </g>
  <text x="80" y="82" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#9aa2b1">SPY · HMM regimes · RSI/ATR</text>
  <text x="80" y="452" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#c7e6db" letter-spacing="1">Backtested · deployed on AWS Lambda</text>
  <text x="80" y="474" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#34d399" letter-spacing="2" opacity="0.85">ALGORITHMIC TRADING BOT</text>
</svg>
