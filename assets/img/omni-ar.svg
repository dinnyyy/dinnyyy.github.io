<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Omni AR — a camera viewfinder with AR object detection boxes">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1420"/>
      <stop offset="1" stop-color="#0e1e2c"/>
    </linearGradient>
    <linearGradient id="aacc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#6ea8fe"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#abg)"/>
  <g stroke="#34d399" stroke-opacity="0.07">
    <path d="M0 125H800M0 250H800M0 375H800M133 0V500M266 0V500M400 0V500M533 0V500M666 0V500"/>
  </g>
  <!-- viewfinder corners -->
  <g stroke="#e8eaf0" stroke-opacity="0.55" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M70 90 h34 M70 90 v34"/>
    <path d="M730 90 h-34 M730 90 v34"/>
    <path d="M70 410 h34 M70 410 v-34"/>
    <path d="M730 410 h-34 M730 410 v-34"/>
  </g>
  <!-- detection box 1 -->
  <g fill="none" stroke="url(#aacc)" stroke-width="2.5">
    <rect x="150" y="150" width="180" height="140" rx="6"/>
  </g>
  <rect x="150" y="128" width="86" height="22" rx="4" fill="#34d399"/>
  <text x="158" y="144" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#08221a" font-weight="700">desk · 0.98</text>
  <!-- detection box 2 -->
  <g fill="none" stroke="#6ea8fe" stroke-width="2.5">
    <rect x="420" y="220" width="230" height="150" rx="6"/>
  </g>
  <rect x="420" y="198" width="96" height="22" rx="4" fill="#6ea8fe"/>
  <text x="428" y="214" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#0a1420" font-weight="700">keys · 0.91</text>
  <!-- reticle -->
  <circle cx="400" cy="250" r="6" fill="none" stroke="#e8eaf0" stroke-opacity="0.6" stroke-width="2"/>
  <text x="70" y="460" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#c7e6db" letter-spacing="1">"Where did I leave my keys?"</text>
  <text x="70" y="482" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#34d399" letter-spacing="2" opacity="0.85">OMNI AR · PHOTOGRAPHIC MEMORY</text>
</svg>
